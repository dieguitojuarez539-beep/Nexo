services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["sh", "-c", "node src/migrate.mjs && node src/seed.mjs && node src/main.mjs"]
  worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [api]
    volumes: ["clamav:/var/lib/clamav"]
    command: ["node", "src/worker.mjs"]
volumes:
  postgres:
  redis:
  clamav:
